<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Moon Phone iOS V4</title>
    <style>
        /* =========================================
           1. 全局基础设置
           ========================================= */
        :root {
            --app-bg: #f2f2f7;
            --header-bg: rgba(249, 249, 249, 0.9);
            --dock-bg: rgba(255, 255, 255, 0.2);
            --text-color: #000;
        }

        /* 动态字体定义 */
        @font-face {
            font-family: 'UserCustomFont';
            src: url('') format('woff2'); /* JS动态填充 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'UserCustomFont', -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a; /* 外部背景深色，突出手机 */
            overflow: hidden;
        }

        /* =========================================
           2. 手机外框 (The Frame)
           ========================================= */
        .phone-frame {
            width: 414px;
            height: 896px;
            background-color: #000;
            border-radius: 50px;
            box-shadow: 0 0 0 8px #1a1a1a, 0 0 0 10px #4a4a4a, 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* 全屏模式样式 */
        .phone-frame.fullscreen {
            width: 100vw;
            height: 100vh;
            border-radius: 0;
            box-shadow: none;
            border: none;
        }

        .screen {
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1621574539436-4bf807755e34?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover; /* iOS 风格壁纸 */
            position: relative;
            overflow: hidden;
            border-radius: 40px; /* 屏幕圆角 */
        }
        .phone-frame.fullscreen .screen {
            border-radius: 0;
        }

        /* =========================================
           3. 状态栏 (Status Bar)
           ========================================= */
        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 44px; /* iOS 标准高度 */
            padding: 0 22px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end; /* 底部对齐，避免贴顶太近 */
            padding-bottom: 8px;
            z-index: 2000;
            color: white;
            font-weight: 600;
            font-size: 15px;
            pointer-events: none; /* 让点击穿透状态栏 */
        }
        
        .status-left {
            width: 60px;
            text-align: center;
        }

        .status-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 灵动岛/刘海 */
        .notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background-color: #000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            z-index: 2001;
            transition: all 0.3s;
        }
        .phone-frame.fullscreen .notch {
            display: none; 
        }

        /* 电池图标 (模仿 iOS) */
        .battery {
            width: 28px;
            height: 14px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 4px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 1px;
            background: rgba(0,0,0,0.2);
        }
        .battery::after { /* 电池头 */
            content: '';
            position: absolute;
            right: -3px;
            top: 3.5px;
            width: 2px;
            height: 5px;
            background: rgba(255,255,255,0.4);
            border-top-right-radius: 2px;
            border-bottom-right-radius: 2px;
        }
        .battery-fill {
            height: 100%;
            background-color: white;
            border-radius: 2px;
            width: 60%; /* 动态 */
            position: relative;
            z-index: 1;
        }
        .battery-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 9px;
            font-weight: 800;
            z-index: 2;
            color: black; /* 电池内部数字颜色，在白色背景上为黑 */
            mix-blend-mode: hard-light; /* 简单的混合模式尝试，若不行则靠JS切换颜色 */
        }
        /* 当电量低变为红色时的处理 */
        .battery-fill.low { background-color: #ff3b30; }

        /* =========================================
           4. 主屏幕 & Dock
           ========================================= */
        .home-screen {
            padding-top: 60px;
            padding-left: 20px;
            padding-right: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            height: 100%;
            transition: transform 0.3s ease;
        }

        .dock-container {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            height: 85px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .app-icon:active { transform: scale(0.9); }
        
        .icon-shape {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            position: relative;
        }
        .app-name {
            font-size: 11px;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            font-weight: 500;
        }
        .dock-container .app-name { display: none; } /* Dock栏不显示名字 */

        /* 图标特定样式 */
        .icon-settings { background: linear-gradient(135deg, #8e8e93, #636366); }
        .icon-weather { background: linear-gradient(180deg, #2f80ed, #56ccf2); }
        .icon-font { background: linear-gradient(135deg, #FF9500, #FF5E3A); }
        .icon-photos { background: white; } /* 占位 */

        /* =========================================
           5. App 视图容器
           ========================================= */
        .app-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--app-bg);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .app-view.active {
            transform: translateX(0);
        }

        /* App 头部导航 */
        .app-header {
            height: 44px; /* 导航栏高度 */
            margin-top: 44px; /* 避开状态栏 */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
            background: transparent;
            position: relative;
            z-index: 10;
        }
        
        .back-btn {
            position: absolute;
            left: 10px;
            font-size: 24px;
            color: #007aff;
            cursor: pointer;
            font-weight: 300;
            padding: 10px;
            line-height: 1;
        }
        .app-title {
            font-size: 17px;
            font-weight: 600;
        }
        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            padding-bottom: 40px;
        }

        /* =========================================
           6. 设置 App 样式
           ========================================= */
        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .group-title {
            font-size: 13px;
            color: #666;
            margin-left: 15px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .group-box {
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        .list-item {
            padding: 12px 15px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 16px;
        }
        .list-item:last-child { border-bottom: none; }
        
        /* 输入框和按钮 */
        .setting-input {
            flex: 1;
            border: none;
            text-align: right;
            font-size: 16px;
            color: #007aff;
            outline: none;
            background: transparent;
            margin-left: 10px;
        }
        .setting-btn {
            background: #007aff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .setting-btn:active { opacity: 0.8; }
        
        /* 开关 Toggle */
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 30px;
            -webkit-appearance: none;
            background: #e9e9ea;
            border-radius: 20px;
            transition: 0.3s;
            outline: none;
            cursor: pointer;
        }
        .toggle-switch:checked { background: #34c759; }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 26px;
            height: 26px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .toggle-switch:checked::after { left: 22px; }

        /* 下拉菜单 */
        .setting-select {
            border: none;
            background: transparent;
            font-size: 16px;
            color: #007aff;
            text-align: right;
            outline: none;
            direction: rtl; /* 让选项靠右 */
        }

        /* 滑块 */
        .slider-container { width: 100%; padding: 5px 0; }
        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: #ddd;
            border-radius: 2px;
            outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            border-radius: 50%;
            cursor: pointer;
        }

        /* =========================================
           7. 天气 App 样式 (iOS 风格)
           ========================================= */
        #app-weather {
            background: linear-gradient(180deg, #183556 0%, #295385 50%, #5d8ab5 100%);
            color: white;
        }
        #app-weather .app-header { background: transparent; }
        #app-weather .back-btn { color: white; }
        
        .weather-main {
            text-align: center;
            margin-bottom: 30px;
        }
        .weather-city { font-size: 32px; font-weight: 400; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .weather-temp { font-size: 90px; font-weight: 200; letter-spacing: -2px; }
        .weather-desc { font-size: 20px; font-weight: 500; opacity: 0.9; text-transform: capitalize; }
        .weather-hl { font-size: 16px; font-weight: 500; opacity: 0.9; margin-top: 5px; }

        .weekly-forecast {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 10px 15px;
            font-size: 15px;
        }
        .forecast-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .forecast-row:last-child { border-bottom: none; }
        
        .day-name { width: 50px; font-weight: 500; }
        .day-icon { flex: 1; text-align: center; font-size: 20px; }
        .day-temps { width: 80px; text-align: right; display: flex; justify-content: flex-end; gap: 10px; }
        .temp-min { opacity: 0.6; }
        .temp-max { font-weight: 600; }

        /* =========================================
           8. 字体 App 样式
           ========================================= */
        #font-preview-area {
            background: white;
            border-radius: 10px;
            padding: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* =========================================
           9. 模态弹窗
           ========================================= */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-box {
            background: rgba(255,255,255,0.9);
            width: 270px;
            border-radius: 14px;
            text-align: center;
            overflow: hidden;
        }
        .modal-title { padding: 15px; font-weight: 600; font-size: 17px; }
        .modal-input {
            width: 80%;
            margin-bottom: 15px;
            padding: 5px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .modal-buttons { border-top: 1px solid #ccc; display: flex; }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-size: 17px;
            cursor: pointer;
            color: #007aff;
        }
        .modal-btn:first-child { border-right: 1px solid #ccc; font-weight: 400; }
        .modal-btn:last-child { font-weight: 600; }

    </style>
</head>
<body>

    <div class="phone-frame" id="phone">
        
        <!-- 状态栏 -->
        <div class="status-bar" id="statusBar">
            <div class="status-left">
                <span id="clock">09:41</span>
            </div>
            <div class="notch" id="notch"></div>
            <div class="status-right">
                <span style="font-size: 12px; font-weight: bold;">>ᴗoಣ</span> <!-- WIFI 颜文字 -->
                <div class="battery">
                    <div class="battery-fill" id="batteryFill"></div>
                    <span class="battery-text" id="batteryText">100</span>
                </div>
            </div>
        </div>

        <!-- 屏幕内容 -->
        <div class="screen">
            
            <!-- 主屏幕 -->
            <div class="home-screen" id="homeScreen">
                <!-- App Icons will be here if needed for grid -->
            </div>

            <!-- Dock 栏 -->
            <div class="dock-container">
                <div class="app-icon" onclick="openApp('app-settings')">
                    <div class="icon-shape icon-settings">⚙️</div>
                    <span class="app-name">设置</span>
                </div>
                <div class="app-icon" onclick="openApp('app-weather')">
                    <div class="icon-shape icon-weather">☀️</div>
                    <span class="app-name">天气</span>
                </div>
                <div class="app-icon" onclick="openApp('app-font')">
                    <div class="icon-shape icon-font">Aa</div>
                    <span class="app-name">字体</span>
                </div>
            </div>

            <!-- 设置 App -->
            <div class="app-view" id="app-settings">
                <div class="app-header">
                    <div class="back-btn" onclick="goHome()">＜</div>
                    <div class="app-title">设置</div>
                </div>
                <div class="app-content">
                    
                    <div class="group-title">外观</div>
                    <div class="group-box">
                        <div class="list-item">
                            <span>显示状态栏</span>
                            <input type="checkbox" class="toggle-switch" checked onchange="toggleStatusBar(this)">
                        </div>
                        <div class="list-item">
                            <span>全屏模式 </span>
                            <input type="checkbox" class="toggle-switch" onchange="toggleFullscreen(this)">
                        </div>
                    </div>

                    <div class="group-title" style="margin-top:20px;">大模型 API 配置</div>
                    <div class="group-box">
                        <div class="list-item">
                            <span>URL</span>
                            <input type="text" id="apiUrl" class="setting-input" placeholder="https://api.openai.com/v1">
                        </div>
                        <div class="list-item">
                            <span>密钥 (Key)</span>
                            <input type="password" id="apiKey" class="setting-input" placeholder="sk-...">
                        </div>
                        <div class="list-item" style="justify-content: center;">
                            <button class="setting-btn" onclick="fetchModels()" style="width: 100%;">拉取模型列表</button>
                        </div>
                        <div class="list-item">
                            <span>选择模型</span>
                            <select id="modelSelect" class="setting-select">
                                <option value="" disabled selected>请先拉取</option>
                            </select>
                        </div>
                    </div>

                    <div class="group-title" style="margin-top:20px;">思维温度 (Temperature)</div>
                    <div class="group-box" style="padding: 10px 15px;">
                        <div style="display:flex; justify-content:space-between; font-size:12px; color:#888; margin-bottom:5px;">
                            <span>保守 (0.0)</span>
                            <span id="tempDisplay">0.7</span>
                            <span>五花八门 (1.0)</span>
                        </div>
                        <div class="slider-container">
                            <input type="range" min="0" max="1" step="0.1" value="0.7" class="slider" oninput="updateTemp(this.value)">
                        </div>
                    </div>

                </div>
            </div>

            <!-- 天气 App (iOS 风格) -->
            <div class="app-view" id="app-weather">
                <div class="app-header">
                    <div class="back-btn" onclick="goHome()">＜</div>
                    <div class="app-title"></div> <!-- 天气App标题通常是城市名，这里置空保持干净 -->
                </div>
                <div class="app-content">
                    <div class="weather-main" id="weatherMain">
                        <div class="weather-city" id="cityName">定位中...</div>
                        <div class="weather-temp" id="currentTemp">--°</div>
                        <div class="weather-desc" id="weatherDesc">获取数据中</div>
                        <div class="weather-hl">最高: <span id="todayHigh">--</span>° 最低: <span id="todayLow">--</span>°</div>
                    </div>

                    <div class="group-title" style="color: rgba(255,255,255,0.6); margin-left: 0;">7 天预报</div>
                    <div class="weekly-forecast" id="forecastList">
                        <!-- 动态生成 -->
                        <div style="text-align:center; padding:10px;">请允许浏览器获取位置权限以显示真实天气</div>
                    </div>
                </div>
            </div>

            <!-- 字体 App -->
            <div class="app-view" id="app-font">
                <div class="app-header">
                    <div class="back-btn" onclick="goHome()">＜</div>
                    <div class="app-title">字体管家</div>
                </div>
                <div class="app-content">
                    <div class="group-title">预览</div>
                    <div id="font-preview-area">
                        The quick brown fox jumps over the lazy dog.<br>
                        你好，世界。
                    </div>

                    <div class="group-title">自定义</div>
                    <div class="group-box">
                        <div class="list-item">
                            <span>字体 URL</span>
                            <input type="text" id="fontUrlInput" class="setting-input" placeholder="输入CSS字体链接" oninput="previewFont(this.value)">
                        </div>
                        <div class="list-item" style="justify-content: center;">
                            <button class="setting-btn" onclick="openSaveFontModal()" style="width: 100%;">保存当前为预设</button>
                        </div>
                    </div>

                    <div class="group-title" style="margin-top:20px;">预设</div>
                    <div class="group-box">
                        <div class="list-item">
                            <span>选择预设</span>
                            <select id="fontPresetSelect" class="setting-select" onchange="loadPreset(this.value)">
                                <option value="default">系统默认</option>
                            </select>
                        </div>
                    </div>

                    <div style="margin-top: 30px; text-align: center;">
                        <button class="setting-btn" onclick="applyGlobalFont()" style="width: 80%; padding: 12px; font-size: 16px; background-color: #34c759;">保存并应用到全局</button>
                        <p style="font-size: 12px; color: #888; margin-top: 10px;">未保存则退出后失效</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- 弹窗 (Modal) -->
    <div class="modal" id="nameModal">
        <div class="modal-box">
            <div class="modal-title">给字体预设命名</div>
            <input type="text" class="modal-input" id="presetNameInput" placeholder="例如: 雅痞圆体">
            <div class="modal-buttons">
                <button class="modal-btn" onclick="closeModal()">取消</button>
                <button class="modal-btn" onclick="savePresetConfirm()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // ============================
        // 基础系统逻辑
        // ============================
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 电池逻辑
        function updateBattery() {
            // 模拟 20% - 100%
            const level = Math.floor(Math.random() * (100 - 20) + 20);
            document.getElementById('batteryText').innerText = level;
            const fill = document.getElementById('batteryFill');
            fill.style.width = level + '%';
            if (level <= 20) {
                fill.classList.add('low');
            } else {
                fill.classList.remove('low');
            }
        }
        updateBattery(); // init

        // App 切换逻辑
        function openApp(appId) {
            document.getElementById(appId).classList.add('active');
            if (appId === 'app-weather') {
                initWeather();
            }
        }

        function goHome() {
            const apps = document.querySelectorAll('.app-view');
            apps.forEach(app => app.classList.remove('active'));
        }

        // ============================
        // 设置逻辑
        // ============================
        function toggleStatusBar(el) {
            const bar = document.getElementById('statusBar');
            if (el.checked) {
                bar.style.display = 'flex';
            } else {
                bar.style.display = 'none';
            }
        }

        function toggleFullscreen(el) {
            const phone = document.getElementById('phone');
            if (el.checked) {
                phone.classList.add('fullscreen');
            } else {
                phone.classList.remove('fullscreen');
            }
        }

        function updateTemp(val) {
            document.getElementById('tempDisplay').innerText = val;
        }

        // 模拟/真实 拉取模型
        async function fetchModels() {
            const url = document.getElementById('apiUrl').value;
            const key = document.getElementById('apiKey').value;
            const select = document.getElementById('modelSelect');
            
            select.innerHTML = '<option>加载中...</option>';

            // 这里只是模拟逻辑，因为没有真实的后端Proxy
            // 如果用户填了真实的OpenAI格式接口，这段代码可以工作
            try {
                if(!url) throw new Error("No URL");
                
                // 模拟延迟
                setTimeout(() => {
                    const mockModels = [
                        {id: 'gpt-4', name: 'GPT-4 (高智商)'},
                        {id: 'gpt-3.5-turbo', name: 'GPT-3.5 (快速)'},
                        {id: 'claude-3', name: 'Claude 3 (拟人)'}
                    ];
                    
                    select.innerHTML = '';
                    mockModels.forEach(m => {
                        let opt = document.createElement('option');
                        opt.value = m.id;
                        opt.innerText = m.name;
                        select.appendChild(opt);
                    });
                    alert(`成功拉取 ${mockModels.length} 个模型 (模拟)`);
                }, 1000);

            } catch (e) {
                select.innerHTML = '<option disabled>拉取失败</option>';
            }
        }

        // ============================
        // 天气逻辑 (Open-Meteo API)
        // ============================
        function initWeather() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(fetchWeather, weatherError);
            } else {
                document.getElementById('weatherDesc').innerText = "不支持定位";
            }
        }

        function weatherError() {
            document.getElementById('cityName').innerText = "未授权位置";
            document.getElementById('weatherDesc').innerText = "无法获取真实天气";
        }

        async function fetchWeather(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            // 使用 Open-Meteo 免费 API
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                // 更新当前
                document.getElementById('cityName').innerText = "本地位置"; // API不返回城市名，通常需要逆地理编码，这里简化
                document.getElementById('currentTemp').innerText = Math.round(data.current_weather.temperature) + "°";
                document.getElementById('weatherDesc').innerText = getWeatherDesc(data.current_weather.weathercode);
                
                // 今天最高最低
                document.getElementById('todayHigh').innerText = Math.round(data.daily.temperature_2m_max[0]);
                document.getElementById('todayLow').innerText = Math.round(data.daily.temperature_2m_min[0]);

                // 生成未来一周
                const list = document.getElementById('forecastList');
                list.innerHTML = ''; // 清空
                
                const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                
                for(let i = 0; i < 7; i++) {
                    const dateStr = data.daily.time[i];
                    const dateObj = new Date(dateStr);
                    const dayName = i === 0 ? "今天" : days[dateObj.getDay()];
                    const code = data.daily.weathercode[i];
                    const max = Math.round(data.daily.temperature_2m_max[i]);
                    const min = Math.round(data.daily.temperature_2m_min[i]);

                    const row = `
                        <div class="forecast-row">
                            <div class="day-name">${dayName}</div>
                            <div class="day-icon">${getWeatherIcon(code)}</div>
                            <div class="day-temps">
                                <span class="temp-min">${min}°</span>
                                <span class="temp-max">${max}°</span>
                            </div>
                        </div>
                    `;
                    list.innerHTML += row;
                }

            } catch (e) {
                console.error(e);
                document.getElementById('weatherDesc').innerText = "数据错误";
            }
        }

        // WMO Code 转换
        function getWeatherDesc(code) {
            const map = {
                0: '晴朗', 1: '多云', 2: '阴', 3: '阴',
                45: '雾', 48: '雾凇',
                51: '毛毛雨', 61: '小雨', 63: '中雨', 65: '大雨',
                71: '小雪', 73: '中雪', 75: '大雪',
                95: '雷雨'
            };
            return map[code] || '未知';
        }

        function getWeatherIcon(code) {
            if(code === 0) return '☀️';
            if(code >= 1 && code <= 3) return '⛅';
            if(code >= 45 && code <= 48) return '🌫️';
            if(code >= 51 && code <= 67) return '🌧️';
            if(code >= 71 && code <= 77) return '❄️';
            if(code >= 95) return '⛈️';
            return '☁️';
        }

        // ============================
        // 字体逻辑
        // ============================
        let savedPresets = JSON.parse(localStorage.getItem('fontPresets')) || [];
        let tempFontUrl = '';

        function previewFont(url) {
            tempFontUrl = url;
            // 简单的注入样式预览
            const previewStyle = `
                @font-face { font-family: 'PreviewFont'; src: url('${url}'); }
                #font-preview-area { font-family: 'PreviewFont', sans-serif; }
            `;
            // 移除旧的preview style if any
            let old = document.getElementById('previewStyleBlock');
            if(old) old.remove();
            
            const style = document.createElement('style');
            style.id = 'previewStyleBlock';
            style.innerHTML = previewStyle;
            document.head.appendChild(style);
        }

        function openSaveFontModal() {
            if(!tempFontUrl) {
                alert("请先输入字体 URL");
                return;
            }
            document.getElementById('nameModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('nameModal').style.display = 'none';
        }

        function savePresetConfirm() {
            const name = document.getElementById('presetNameInput').value;
            if(!name) return;

            savedPresets.push({ name: name, url: tempFontUrl });
            localStorage.setItem('fontPresets', JSON.stringify(savedPresets));
            renderPresets();
            closeModal();
            document.getElementById('presetNameInput').value = '';
        }

        function renderPresets() {
            const sel = document.getElementById('fontPresetSelect');
            sel.innerHTML = '<option value="default">系统默认</option>';
            savedPresets.forEach((p, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.innerText = p.name;
                sel.appendChild(opt);
            });
        }
        renderPresets(); // Init

        function loadPreset(val) {
            if(val === 'default') {
                tempFontUrl = '';
                previewFont(''); // Clear preview
            } else {
                const p = savedPresets[val];
                tempFontUrl = p.url;
                document.getElementById('fontUrlInput').value = p.url;
                previewFont(p.url);
            }
        }

        function applyGlobalFont() {
            // 真正改变 :root 或者 global style
            const styleId = 'globalFontStyle';
            let style = document.getElementById(styleId);
            if(!style) {
                style = document.createElement('style');
                style.id = styleId;
                document.head.appendChild(style);
            }

            if(!tempFontUrl) {
                // Reset
                style.innerHTML = "";
            } else {
                style.innerHTML = `
                    @font-face {
                        font-family: 'UserCustomFont';
                        src: url('${tempFontUrl}');
                        font-display: swap;
                    }
                `;
            }
            alert("字体已保存至全局！");
        }

    </script>
</body>
